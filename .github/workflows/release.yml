name: Docker CI and release

on:
  pull_request:
    paths:
      - docker/**
      - compose.prod.yaml
      - .dockerignore
      - composer.*
      - package*.json
      - packages/**
      - app/**
      - bootstrap/**
      - config/**
      - database/**
      - resources/**
      - routes/**
      - tests/**
      - .github/workflows/release.yml
  push:
    branches: [codex/docker-production, '2.2']
    paths:
      - docker/**
      - compose.prod.yaml
      - .dockerignore
      - composer.*
      - package*.json
      - packages/**
      - app/**
      - bootstrap/**
      - config/**
      - database/**
      - resources/**
      - routes/**
      - tests/**
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      platforms:
        description: Image platforms
        required: true
        type: choice
        default: linux/amd64,linux/arm64
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  ci:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment failure handling
        run: python3 docker/test-deploy.py
      - uses: docker/setup-buildx-action@v3
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: /tmp/krayin-build-cache
          key: docker-ci-${{ runner.os }}-${{ github.sha }}
          restore-keys: docker-ci-${{ runner.os }}-
      - name: Build local images
        shell: bash
        run: |
          set -euo pipefail
          for target in app web test; do
            cache_args=()
            if [[ -d "/tmp/krayin-build-cache/$target" ]]; then
              cache_args+=(--cache-from "type=local,src=/tmp/krayin-build-cache/$target")
            fi
            docker buildx build \
              --file docker/Dockerfile \
              --target "$target" \
              --platform linux/amd64 \
              --tag "krayin-$target:ci" \
              --load \
              "${cache_args[@]}" \
              --cache-to "type=local,dest=/tmp/krayin-build-cache-next/$target,mode=max" \
              .
          done
          rm -rf /tmp/krayin-build-cache
          mv /tmp/krayin-build-cache-next /tmp/krayin-build-cache
      - name: Smoke test production stack
        env:
          APP_IMAGE: krayin-app:ci
          WEB_IMAGE: krayin-web:ci
          TEST_IMAGE: krayin-test:ci
        run: bash docker/smoke.sh

  publish:
    name: Publish release images and bundle
    if: github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      app-digest: ${{ steps.images.outputs.app-digest }}
      web-digest: ${{ steps.images.outputs.web-digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: /tmp/krayin-build-cache
          key: docker-release-${{ runner.os }}-${{ inputs.platforms }}-${{ github.sha }}
          restore-keys: docker-release-${{ runner.os }}-${{ inputs.platforms }}-
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish images
        id: images
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
          RELEASE_SHA: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          case "$PLATFORMS" in
            linux/amd64|linux/arm64|linux/amd64,linux/arm64) ;;
            *) echo 'Unsupported platforms' >&2; exit 1 ;;
          esac
          printf 'RELEASE_SHA=%s\n' "$RELEASE_SHA" > release.env
          for target in app web; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-$target"
            cache_args=()
            if [[ -d "/tmp/krayin-build-cache/$target" ]]; then
              cache_args+=(--cache-from "type=local,src=/tmp/krayin-build-cache/$target")
            fi
            docker buildx build \
              --file docker/Dockerfile \
              --target "$target" \
              --platform "$PLATFORMS" \
              --tag "$image:sha-$RELEASE_SHA" \
              --label "org.opencontainers.image.revision=$RELEASE_SHA" \
              --label "org.opencontainers.image.source=$SOURCE_URL" \
              --metadata-file "/tmp/krayin-$target-metadata.json" \
              --push \
              "${cache_args[@]}" \
              --cache-to "type=local,dest=/tmp/krayin-build-cache-next/$target,mode=max" \
              .
            digest="$(jq -er '."containerimage.digest"' "/tmp/krayin-$target-metadata.json" | tr -d '[:space:]')"
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Invalid digest for $target" >&2
              exit 1
            fi
            printf '%s-digest=%s\n' "$target" "$digest" >> "$GITHUB_OUTPUT"
            printf '%s_IMAGE=%s@%s\n' "${target^^}" "$image" "$digest" >> release.env
          done
          rm -rf /tmp/krayin-build-cache
          mv /tmp/krayin-build-cache-next /tmp/krayin-build-cache
      - name: Smoke test published image digests
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          APP_IMAGE="$(sed -n 's/^APP_IMAGE=//p' release.env)"
          WEB_IMAGE="$(sed -n 's/^WEB_IMAGE=//p' release.env)"
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$APP_IMAGE" =~ ^"$prefix"-app@sha256:[a-f0-9]{64}$ ]]
          [[ "$WEB_IMAGE" =~ ^"$prefix"-web@sha256:[a-f0-9]{64}$ ]]
          case "$PLATFORMS" in
            linux/arm64) smoke_platform=linux/arm64 ;;
            linux/amd64|linux/amd64,linux/arm64) smoke_platform=linux/amd64 ;;
            *) echo 'Unsupported platforms' >&2; exit 1 ;;
          esac
          docker pull --platform "$smoke_platform" "$APP_IMAGE"
          docker pull --platform "$smoke_platform" "$WEB_IMAGE"
          export DOCKER_DEFAULT_PLATFORM="$smoke_platform"
          export APP_IMAGE WEB_IMAGE
          bash docker/smoke.sh
      - name: Verify deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          for file in compose.prod.yaml docker/.env.example docker/deploy.sh docker/backup.sh docker/install.php docker/README.md release.env; do
            test -s "$file" || { echo "Missing or empty bundle file: $file" >&2; exit 1; }
          done
      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: krayin-release-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            compose.prod.yaml
            docker/.env.example
            docker/deploy.sh
            docker/backup.sh
            docker/install.php
            docker/README.md
            release.env
