name: GREEN-API integration

on:
  pull_request:
    paths:
      - 'packages/Webkul/GreenApi/**'
      - 'tests/Feature/GreenApi/**'
      - 'bootstrap/providers.php'
      - 'composer.*'
      - '.github/workflows/green-api-tests.yml'
  push:
    branches: ['feature/green-api-integration']
    paths:
      - 'packages/Webkul/GreenApi/**'
      - 'tests/Feature/GreenApi/**'
      - 'bootstrap/providers.php'
      - 'composer.*'
      - '.github/workflows/green-api-tests.yml'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: krayin_green_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptesting"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: krayin_green_test
      DB_USERNAME: root
      DB_PASSWORD: testing
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: calendar, curl, gd, intl, mbstring, pdo_mysql, zip
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force --no-interaction
          touch storage/installed
      - run: php artisan test --compact tests/Feature/GreenApi
      - run: vendor/bin/pint --test packages/Webkul/GreenApi tests/Feature/GreenApi bootstrap/providers.php
