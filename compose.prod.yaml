name: ${COMPOSE_PROJECT_NAME:-krayin}

x-app: &app
  image: ${APP_IMAGE:?Set APP_IMAGE to a release image}
  env_file: ${APP_ENV_FILE:-.env.prod}
  environment:
    APP_ENV: production
    APP_DEBUG: 'false'
    DB_HOST: db
    DB_PORT: '3306'
    QUEUE_CONNECTION: database
  volumes:
    - storage:/var/www/html/storage
  init: true
  restart: unless-stopped
  stop_grace_period: 150s
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app

  worker:
    <<: *app
    command: ['php', 'artisan', 'queue:work', 'database', '--queue=${GREEN_API_QUEUE:-default}', '--tries=5', '--timeout=60', '--sleep=2', '--max-time=3600']
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    command: ['crm-scheduler']
    healthcheck:
      disable: true

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to a release image}
    ports:
      - '${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080'
    volumes:
      - storage:/var/www/html/storage:ro
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_root_password
    volumes:
      - database:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30

volumes:
  database:
  storage:

secrets:
  db_root_password:
    file: ${DB_ROOT_PASSWORD_FILE:-./secrets/db-root-password}
