worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # The host TLS proxy must overwrite X-Forwarded-Proto and preserve Host.
    # Compose publishes this listener on loopback only; do not expose it directly.
    map $http_x_forwarded_proto $application_https {
        default "";
        https on;
    }
    map $http_x_forwarded_proto $application_port {
        default 80;
        https 443;
    }
    map $http_x_forwarded_proto $application_scheme {
        default http;
        https https;
    }

    server {
        listen 8080;
        root /var/www/html/public;
        index index.php;
        charset utf-8;
        client_max_body_size 40m;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # All requests for application PHP pass through the front controller.
        location = /index.php {
            internal;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_param HTTPS $application_https if_not_empty;
            fastcgi_param SERVER_PORT $application_port;
            fastcgi_param REQUEST_SCHEME $application_scheme;
            fastcgi_pass app:9000;
            fastcgi_read_timeout 120s;
        }

        # Uploaded scripts are never executed or returned as source.
        location ~* \.php(?:/|$) {
            return 404;
        }

        location ~ /\. {
            deny all;
        }

        location = /storage {
            return 301 /storage/;
        }

        location /storage/ {
            alias /var/www/html/storage/app/public/;
            disable_symlinks on;
            autoindex off;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
    }
}
